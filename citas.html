<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citas agendadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Kevin Barber Shop</a>
      <a class="nav-link text-white" href="index.html">Volver al inicio</a>
    </div>
  </nav>

  <main class="container py-5">
    <h2 class="text-center mb-4">Citas agendadas</h2>

    <!-- Aqui mostramos mensajes (por ejemplo, "Cita eliminada") -->
    <div id="aviso"></div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>WhatsApp</th>
            <th>Correo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>

    <p id="mensajeVacio" class="text-center text-secondary"></p>
  </main>

  <!-- MODAL: ventanita emergente para editar. Esta oculta hasta que JavaScript la abre -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <form id="formEditar">
          <div class="modal-header">
            <h5 class="modal-title">Editar cita</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <!-- Campo oculto: guarda el id de la cita que se esta editando -->
            <input type="hidden" id="editId">

            <div class="mb-3">
              <label for="editNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="editNombre" required>
            </div>

            <div class="mb-3">
              <label for="editServicio" class="form-label">Tipo de servicio</label>
              <select class="form-select" id="editServicio">
                <option>Corte de cabello</option>
                <option>Arreglo de barba</option>
                <option>Asesoría de imagen</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="editWhatsapp" class="form-label">WhatsApp</label>
              <input type="tel" class="form-control" id="editWhatsapp" required>
            </div>

            <div class="mb-3">
              <label for="editCorreo" class="form-label">Correo</label>
              <input type="email" class="form-control" id="editCorreo" required>
            </div>

            <div class="mb-3">
              <label for="editFecha" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="editFecha" required>
            </div>

            <div class="mb-3">
              <label for="editHora" class="form-label">Hora</label>
              <select class="form-select" id="editHora" required>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
              </select>
            </div>

            <!-- Aqui mostramos errores dentro de la ventanita -->
            <div id="avisoModal"></div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-dark">Guardar cambios</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Guardamos los elementos de la pagina en variables
    const cuerpo = document.getElementById("cuerpoTabla");
    const mensajeVacio = document.getElementById("mensajeVacio");
    const aviso = document.getElementById("aviso");
    const avisoModal = document.getElementById("avisoModal");
    const formEditar = document.getElementById("formEditar");

    // Creamos el objeto que abre y cierra la ventanita (modal) de Bootstrap
    const modalEditar = new bootstrap.Modal(document.getElementById("modalEditar"));

    // Funcion que pide las citas al PHP y las dibuja en la tabla
    async function cargarCitas() {

      const respuesta = await fetch("listar_cita.php");
      const citas = await respuesta.json();

      // Vaciamos la tabla antes de llenarla para no duplicar filas
      cuerpo.innerHTML = "";

      if (citas.length == 0) {
        mensajeVacio.innerHTML = "Todavía no hay citas agendadas.";
        return;
      }
      mensajeVacio.innerHTML = "";

      for (let i = 0; i < citas.length; i++) {
        const c = citas[i];
        const fila = document.createElement("tr");

        const valores = [c.id, c.nombre, c.servicio, c.fecha, c.hora, c.whatsapp, c.correo];

        for (let j = 0; j < valores.length; j++) {
          const celda = document.createElement("td");
          celda.textContent = valores[j];
          fila.appendChild(celda);
        }

        // Ultima celda: los botones Editar y Eliminar
        const celdaAcciones = document.createElement("td");

        // Boton Editar: al hacer clic, abre la ventanita con los datos de ESTA cita
        const botonEditar = document.createElement("button");
        botonEditar.textContent = "Editar";
        botonEditar.className = "btn btn-warning btn-sm me-2";
        botonEditar.onclick = function () {
          abrirEditar(c);
        };

        // Boton Eliminar: al hacer clic, borra ESTA cita
        const botonEliminar = document.createElement("button");
        botonEliminar.textContent = "Eliminar";
        botonEliminar.className = "btn btn-danger btn-sm";
        botonEliminar.onclick = function () {
          eliminarCita(c.id);
        };

        celdaAcciones.appendChild(botonEditar);
        celdaAcciones.appendChild(botonEliminar);
        fila.appendChild(celdaAcciones);

        cuerpo.appendChild(fila);
      }
    }

    // Funcion que abre la ventanita con los datos de la cita
    function abrirEditar(c) {
      // Llenamos cada campo con el valor actual de la cita
      document.getElementById("editId").value = c.id;
      document.getElementById("editNombre").value = c.nombre;
      document.getElementById("editServicio").value = c.servicio;
      document.getElementById("editWhatsapp").value = c.whatsapp;
      document.getElementById("editCorreo").value = c.correo;
      document.getElementById("editFecha").value = c.fecha;
      document.getElementById("editHora").value = c.hora;

      avisoModal.innerHTML = "";
      modalEditar.show();
    }

    // Cuando guardan los cambios en la ventanita
    formEditar.addEventListener("submit", async function (evento) {

      // Evitamos que la pagina se recargue
      evento.preventDefault();

      // Juntamos los datos nuevos
      const datos = {
        id:       document.getElementById("editId").value,
        nombre:   document.getElementById("editNombre").value,
        servicio: document.getElementById("editServicio").value,
        whatsapp: document.getElementById("editWhatsapp").value,
        correo:   document.getElementById("editCorreo").value,
        fecha:    document.getElementById("editFecha").value,
        hora:     document.getElementById("editHora").value
      };

      // Los mandamos al PHP con POST
      const respuesta = await fetch("editar_cita.php", {
        method: "POST",
        body: JSON.stringify(datos)
      });
      const resultado = await respuesta.json();

      if (resultado.ok == true) {
        // Cerramos la ventanita, avisamos y recargamos la tabla
        modalEditar.hide();
        aviso.innerHTML = '<div class="alert alert-success">' + resultado.mensaje + '</div>';
        cargarCitas();
      } else {
        // Si fallo, mostramos el error dentro de la ventanita
        avisoModal.innerHTML = '<div class="alert alert-danger">' + resultado.mensaje + '</div>';
      }
    });

    // Funcion que elimina una cita
    async function eliminarCita(id) {

      if (confirm("¿Seguro que quieres eliminar esta cita?") == false) {
        return;
      }

      const respuesta = await fetch("eliminar_cita.php", {
        method: "POST",
        body: JSON.stringify({ id: id })
      });
      const resultado = await respuesta.json();

      aviso.innerHTML = '<div class="alert alert-success">' + resultado.mensaje + '</div>';
      cargarCitas();
    }

    // Llamamos a la funcion al abrir la pagina
    cargarCitas();
  </script>
</body>
</html>
