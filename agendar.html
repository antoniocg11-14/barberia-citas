<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar cita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Kevin Barber Shop</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#galeria">Galería</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
          <li class="nav-item"><a class="nav-link active" href="agendar.html">Agendar</a></li>
          <li class="nav-item"><a class="nav-link" href="citas.html">Ver citas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="bg-light py-5">
    <div class="container">
      <h2 class="text-center mb-4">Agenda tu cita</h2>

      <div class="row justify-content-center">
        <div class="col-md-6">

         <form id="formCita" novalidate>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="mb-3">
              <label for="servicio" class="form-label">Tipo de servicio</label>
              <select class="form-select" id="servicio">
                <option>Corte de cabello</option>
                <option>Arreglo de barba</option>
                <option>Asesoría de imagen</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="whatsapp" class="form-label">Número de WhatsApp</label>
              <input type="tel" class="form-control" id="whatsapp" placeholder="33 1234 5678" required>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" placeholder="tucorreo@ejemplo.com" required>
              <div class="form-text">Lo usaremos solo si no logramos contactarte por WhatsApp.</div>
            </div>

            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" required>
            </div>

            <div class="mb-3">
              <label for="hora" class="form-label">Hora disponible</label>
              <select class="form-select" id="hora" required>
                <option value="">Primero elige una fecha</option>
              </select>
            </div>

            <div id="aviso" class="mb-3"></div>

            <button type="submit" class="btn btn-dark w-100">Reservar cita</button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 Kevin Barber Shop. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // Direccion de mi programa de Google (Apps Script)
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycby7km7AUFrXjpTWJ1UohyraULubs8fZTb91Fp4wzx0agFSXlmlh1i_QXm4VI7oejehr/exec";

    // Guardamos los elementos de la pagina en variables
    const formulario    = document.getElementById("formCita");
    const campoNombre   = document.getElementById("nombre");
    const campoWhatsapp = document.getElementById("whatsapp");
    const campoCorreo   = document.getElementById("correo");
    const campoFecha    = document.getElementById("fecha");
    const campoHora     = document.getElementById("hora");
    const aviso         = document.getElementById("aviso");

    // PARTE 1: cuando cambia la fecha, pedimos las horas libres
    campoFecha.addEventListener("change", async function () {

      const respuesta = await fetch(URL_SCRIPT + "?fecha=" + campoFecha.value);
      const horas = await respuesta.json();

      if (horas.length == 0) {
        campoHora.innerHTML = '<option value="">Sin horarios ese día</option>';
        return;
      }

      campoHora.innerHTML = '<option value="">Elige una hora</option>';
      for (let i = 0; i < horas.length; i++) {
        campoHora.innerHTML += '<option value="' + horas[i] + '">' + horas[i] + '</option>';
      }
    });

    // PARTE 2: cuando envian el formulario, primero VALIDAMOS y luego reservamos
    formulario.addEventListener("submit", async function (evento) {

      // Evitamos que la pagina se recargue
      evento.preventDefault();

      // Leemos los datos. trim() quita espacios al inicio y al final
      const nombre   = campoNombre.value.trim();
      const correo   = campoCorreo.value.trim();
      // replaceAll quita los espacios del telefono ("33 1234 5678" -> "3312345678")
      const whatsapp = campoWhatsapp.value.replaceAll(" ", "");

      // Quitamos las marcas rojas de intentos anteriores
      campoNombre.classList.remove("is-invalid");
      campoWhatsapp.classList.remove("is-invalid");
      campoCorreo.classList.remove("is-invalid");
      campoFecha.classList.remove("is-invalid");
      campoHora.classList.remove("is-invalid");

      // Lista donde iremos guardando los errores que encontremos
      const errores = [];

      // Regla 1: el nombre debe tener al menos 3 letras
      if (nombre.length < 3) {
        errores.push("El nombre debe tener al menos 3 letras.");
        campoNombre.classList.add("is-invalid");
      }

      // Regla 2: el WhatsApp debe tener exactamente 10 digitos y solo numeros
      if (whatsapp.length != 10 || isNaN(whatsapp)) {
        errores.push("El WhatsApp debe tener 10 números, sin letras.");
        campoWhatsapp.classList.add("is-invalid");
      }

      // Regla 3: el correo debe tener @ y un punto
      if (correo.includes("@") == false || correo.includes(".") == false) {
        errores.push("Escribe un correo válido, por ejemplo nombre@correo.com.");
        campoCorreo.classList.add("is-invalid");
      }

      // Regla 4: debe elegir una fecha
      if (campoFecha.value == "") {
        errores.push("Elige una fecha.");
        campoFecha.classList.add("is-invalid");
      }

      // Regla 5: debe elegir una hora de la lista
      if (campoHora.value == "") {
        errores.push("Elige una hora disponible.");
        campoHora.classList.add("is-invalid");
      }

      // Si hay errores, los mostramos y NO seguimos
      if (errores.length > 0) {
        aviso.innerHTML = '<div class="alert alert-danger">' + errores.join("<br>") + '</div>';
        return;
      }

      // Si todo esta bien, seguimos con la reserva
      aviso.innerHTML = "Agendando tu cita...";

      const datos = {
        nombre:   nombre,
        servicio: document.getElementById("servicio").value,
        whatsapp: whatsapp,
        correo:   correo,
        fecha:    campoFecha.value,
        hora:     campoHora.value
      };

      // Paso 1: reservamos en Google Calendar
      const respuesta = await fetch(URL_SCRIPT, {
        method: "POST",
        body: JSON.stringify(datos)
      });
      const resultado = await respuesta.json();

      if (resultado.ok == true) {

        // Paso 2: guardamos al cliente en la base de datos SQLite
        await fetch("guardar_cita.php", {
          method: "POST",
          body: JSON.stringify(datos)
        });

        aviso.innerHTML = '<div class="alert alert-success">' + resultado.mensaje + '</div>';
        formulario.reset();
        campoHora.innerHTML = '<option value="">Primero elige una fecha</option>';

      } else {
        aviso.innerHTML = '<div class="alert alert-danger">' + resultado.mensaje + '</div>';
      }
    });
  </script>
</body>
</html>
